name: Feature request
description: Propose a command, flag, pack, parser or workflow change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and where agent-flow gets in the way or stays silent.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command, flag or behaviour you would expect. Example output is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
