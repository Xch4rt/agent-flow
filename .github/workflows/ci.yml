name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: CLI smoke
        run: |
          node dist/cli.js --version
          cd "$(mktemp -d)" && git init -q
          CI=1 node "$GITHUB_WORKSPACE/dist/cli.js" init --claude
          node "$GITHUB_WORKSPACE/dist/cli.js" onboard
          node "$GITHUB_WORKSPACE/dist/cli.js" doctor
          node "$GITHUB_WORKSPACE/dist/cli.js" plan init --scaffold
          node "$GITHUB_WORKSPACE/dist/cli.js" plan validate

  # Single required status check for branch protection: green only when every matrix job is.
  ci:
    name: ci
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
